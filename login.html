<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Assistant</title>
    <link rel="stylesheet" href="login.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="darkmode.js"></script>
</head>

<body>

    <header class="navbar">

        <a href="home.html" class="brand">
            <img src="logo.png" alt="Barangay Talimundoc Logo">
            <span>SMART ASSISTANT</span>
        </a>

        <nav>
            <a href="home.html">Home</a>
            <a href="home.html#about">About</a>
            <a href="home.html#services">Services</a>
            <a href="login.html" class="active">Login</a>
            <a href="signup.html" class="register-btn">Register</a>
        </nav>

    </header>

    <main class="login-page">

        <div class="decor decor-top"></div>
        <div class="decor decor-bottom"></div>

        <section class="intro">

            <div class="intro-small">
                BARANGAY TALIMUNDOC HEALTH CENTER
            </div>

            <h1>
                <span>Join</span> SMART<br>ASSISTANT
            </h1>

        </section>

        <section class="login-container">

            <div class="login-card">

                <p class="terms">
                    By clicking ‘Log in’, you agree to our
                    <a href="#">terms of service</a> and acknowledge you have
                    read our <a href="#">privacy policy</a>
                </p>

                <div class="line"></div>

                <form id="loginForm">

                    <div class="input-group">
                        <input
                            type="text"
                            name="email"
                            id="email"
                            placeholder="Username or Email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div id="loginMessage" class="message error" style="display: none;"></div>

                    <button type="submit" class="login-button" id="loginBtn">
                        Login
                    </button>

                    <div style="margin-top: 14px; display: flex; gap: 8px;">
                        <button type="button" id="demoPatientBtn" style="flex: 1; padding: 8px 10px; font-size: 12px; border-radius: 6px; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                            Resident Demo Login
                        </button>
                        <button type="button" id="demoAdminBtn" style="flex: 1; padding: 8px 10px; font-size: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #cbd5e1; cursor: pointer; font-weight: 600; transition: all 0.2s;">
                            Admin Demo Login
                        </button>
                    </div>

                </form>

                <p class="signup-text">
                    Don’t have an account?
                    <a href="signup.html">Sign up here</a>
                </p>

                <div style="margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,0.15); text-align: center;">
                    <a href="patient-portal.html" style="font-size: 13px; color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                        <span>Go to Resident Health Portal &rarr;</span>
                    </a>
                </div>

            </div>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
